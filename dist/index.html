<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14181d">
<title>Tabe Pocket: the scouts</title>
<style>
/* Safe margins: the notch/home-indicator insets PLUS a generous extra margin (top and bottom especially, where
   iPhone landscape cuts things off). ?inset=l,t,r,b overrides the insets to preview a phone in a desktop browser. */
:root{--il:env(safe-area-inset-left,0px);--it:env(safe-area-inset-top,0px);--ir:env(safe-area-inset-right,0px);--ib:env(safe-area-inset-bottom,0px);
  --ml:calc(var(--il) + 12px);--mr:calc(var(--ir) + 12px);--mt:calc(var(--it) + 22px);--mb:calc(var(--ib) + 24px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14181d;color:#eee;font:14px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block}
button{background:#2a3038e8;color:#eee;border:1px solid #444b55;border-radius:12px;padding:8px 11px;font-size:15px;min-width:44px;min-height:40px}
button.on{background:#c8a24a;color:#111;border-color:#c8a24a}
.chip{background:#14181dd8;border:1px solid #3a424c;border-radius:14px;padding:6px 11px;font-size:13px;line-height:1.25;box-shadow:0 2px 8px #0006;max-width:100%}
/* HUD chip, top-left: compact; tap to expand into the full stats popup */
#hud{position:fixed;left:var(--ml);top:var(--mt);display:flex;gap:8px;align-items:center;white-space:nowrap;cursor:pointer}
#hud b{font-size:14px}#hud .dim{opacity:.8}
/* the log: collapsed to a one-line ticker chip at bottom-left; tap to open */
#logchip{position:fixed;left:var(--ml);bottom:var(--mb);max-width:min(60vw,520px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#logwrap{position:fixed;left:var(--ml);bottom:calc(var(--mb) + 40px);width:min(56vw,520px);height:min(46vh,300px);background:#111418ee;display:none;border:1px solid #3a424c;border-radius:14px;overflow:hidden}
#logwrap.open{display:block}#log{height:100%;overflow:auto;padding:6px 10px;font-size:12px;touch-action:pan-y}
.l{padding:1px 0}.l.bark{color:#cfc6a8}.l.event{color:#9fd0ff}.l.warn{color:#ffcf6a}.l.combat{color:#ff8a7a}.l.boat{color:#8aefc0}
/* controls: a short stack on the right, kept to the vertical middle; each opens a small popup menu */
#ctl{position:fixed;right:var(--mr);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#ctl button{min-width:52px;padding:7px 6px;font-size:14px}
/* the reusable popup menu (src/view/ui.ts) */
.pop{position:fixed;z-index:20;background:#1b2027f5;border:1px solid #4a525c;border-radius:14px;padding:8px;box-shadow:0 6px 20px #000a;min-width:150px;max-height:calc(100vh - var(--mt) - var(--mb));overflow:auto;touch-action:pan-y}
.pop h4{margin:2px 4px 6px;font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pop .items{display:flex;flex-wrap:wrap;gap:6px}.pop .items.col{flex-direction:column}.pop .items.col button{text-align:left}
.pop .body{font-size:13px}.pop .body div{margin:4px 2px}
.pop.wide{max-width:min(560px,calc(100vw - var(--ml) - var(--mr) - 80px))}
/* scout card */
#panel{position:fixed;left:var(--ml);right:var(--mr);bottom:var(--mb);max-height:52vh;overflow:auto;background:#1b2027ee;border:1px solid #444;border-radius:14px;padding:10px 12px;display:none;touch-action:pan-y}
#panel.open{display:block}#closepanel{position:absolute;right:8px;top:6px;padding:4px 10px;min-height:32px}
.ph{font-size:17px}.rank{opacity:.75;font-size:13px}.tag{display:inline-block;background:#33404f;border-radius:8px;padding:2px 7px;margin:4px 4px 0 0;font-size:12px}.tag.bad{background:#5a2a2a}
.row{margin-top:6px}.small{font-size:12px;opacity:.75}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:8px}.needs div{display:flex;align-items:center;gap:6px;font-size:12px}
.nl{width:48px;opacity:.8}.nv{width:24px;text-align:right}.bar{flex:1;height:8px;background:#333a44;border-radius:4px;overflow:hidden}.bar span{display:block;height:100%}
.mood span{font-size:12px;margin-right:6px}.neg{color:#ff8a8a}.pos{color:#8adf8a}
#chart{width:100%;height:auto;margin-top:8px;border-radius:6px}
input{width:110px;font-size:15px;padding:7px;border-radius:8px;border:1px solid #555;background:#111;color:#eee}
#rotate{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--mt) + 44px);background:#000a;padding:4px 10px;border-radius:10px;font-size:12px;pointer-events:none}
body.card-open #logwrap,body.card-open #logchip{display:none!important}
#insetdbg{position:fixed;inset:0;pointer-events:none;display:none}
@media (orientation: portrait){#rotate{display:block}#ctl{top:auto;bottom:var(--mb);transform:none}#panel{bottom:calc(var(--mb) + 52px);right:calc(var(--mr) + 64px)}#logchip{max-width:calc(100vw - 110px)}}
@media (orientation: landscape){
  #panel{right:auto;top:var(--mt);bottom:var(--mb);width:38vw;max-height:none}
  #chart{max-height:110px}
}
</style></head><body>
